spring.application.name=taskmanagerbackend

# Disable DataSource and JPA auto-configuration since app uses in-memory services only
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Hard-disable any H2 console to avoid accidental activation/logs
spring.h2.console.enabled=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
# Use default paths:
# - OpenAPI JSON: /v3/api-docs
# - Swagger UI:   /swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework
